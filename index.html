<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Pedidos Toyo MX</title>
  <meta name="theme-color" content="#0B4CCB" />
  <style>
    :root{
      --blue:#0B4CCB;
      --blue2:#0a3aa1;
      --bg:#F3F5F7;
      --card:#ffffff;
      --border:#D1D5DB;
      --text:#111827;
      --muted:#6b7280;
      --shadow:0 10px 25px rgba(0,0,0,.06);
      --radius:18px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
    }

    .app{
      max-width:1180px;
      margin:0 auto;
      padding:14px 14px calc(74px + var(--safe-b));
    }
    @media(min-width: 980px){
      .app{padding:18px}
      body{padding-bottom:0}
    }
    .shell{
      display:grid;
      grid-template-columns: 1fr;
      gap:14px;
    }
    @media(min-width: 980px){
      .shell{grid-template-columns: 360px 1fr; align-items:start}
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:60;
      padding: calc(12px + var(--safe-t)) 14px 10px;
      margin: -14px -14px 14px;
      background:linear-gradient(180deg, rgba(243,245,247,.96) 0%, rgba(243,245,247,.86) 68%, rgba(243,245,247,0) 100%);
      backdrop-filter: blur(10px);
    }
    @media(min-width:980px){
      .topbar{position:static; padding:0; margin:0 0 14px; background:transparent; backdrop-filter:none}
    }
    .brandRow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .mark{
      width:34px;height:34px;border-radius:12px;
      background:linear-gradient(135deg,var(--blue),var(--blue2));
      box-shadow:0 10px 22px rgba(11,76,203,.25);
      flex:0 0 auto;
    }
    .titleWrap{min-width:0}
    h1{
      margin:0;
      font-size:18px;
      letter-spacing:.2px;
      color:var(--blue);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .sub{
      margin-top:3px;
      font-size:12px;
      color:var(--muted);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .pill{
      border:1px solid #c7dbff;
      color:var(--blue);
      padding:8px 10px;
      border-radius:999px;
      font-weight:900;
      background:#eef4ff;
      font-size:12px;
      white-space:nowrap;
    }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      border:1px solid rgba(0,0,0,.03);
      overflow:hidden;
    }
    .cardHd{
      padding:14px 14px 10px;
      border-bottom:1px solid rgba(17,24,39,.10);
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    }
    .cardTitle{font-weight:950;color:#0b3c91;font-size:13px}
    .cardBd{padding:14px}

    label{display:block;font-weight:800;margin-bottom:7px;color:#0b3c91;font-size:13px}
    input,select{
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid var(--border);
      background:#fff;
      font-size:15px;
      outline:none;
    }
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .btn{
      border:1px solid rgba(17,24,39,.12);
      background:#fff;
      border-radius:14px;
      padding:11px 12px;
      cursor:pointer;
      font-weight:900;
      color:#0b3c91;
      font-size:13px;
    }
    .btn.primary{
      background:var(--blue);
      color:#fff;
      border-color:transparent;
    }
    .btn.ghost{
      background:#eef4ff;
      color:var(--blue);
      border:1px solid #c7dbff;
    }
    .hint{margin-top:10px;color:var(--muted);font-size:12.5px;line-height:1.35}

    .tabs{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .tab{
      border:1px solid rgba(17,24,39,.10);
      background:#fff;
      border-radius:999px;
      padding:9px 12px;
      font-weight:950;
      font-size:12px;
      cursor:pointer;
      color:#0b3c91;
    }
    .tab.active{
      background:var(--blue);
      color:#fff;
      border-color:transparent;
    }

    .list{display:flex;flex-direction:column;gap:10px}
    .item{
      border:1px solid rgba(17,24,39,.10);
      background:#fff;
      border-radius:16px;
      padding:12px;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
    }
    .left{min-width:0}
    .name{
      margin:0;
      font-weight:950;
      font-size:14px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      max-width:100%;
    }
    .meta{
      margin-top:4px;
      color:var(--muted);
      font-size:12px;
      font-weight:750;
      line-height:1.25;
    }
    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
      align-items:center;
      flex:0 0 auto;
    }
    .mini{
      border-radius:12px;
      padding:9px 10px;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
      white-space:nowrap;
      border:1px solid rgba(17,24,39,.12);
      background:#fff;
      color:#0b3c91;
    }
    .mini.open{
      border:1px solid #c7dbff;
      background:#eef4ff;
      color:var(--blue);
    }
    .empty{
      padding:12px 2px;
      color:var(--muted);
      font-weight:800;
      font-size:13px;
    }
    @media(min-width:980px){
      .actions{flex-wrap:nowrap}
      .mini{padding:9px 12px}
    }

    .bottombar{
      position:fixed;left:0;right:0;bottom:0;z-index:80;
      padding:10px 10px calc(10px + var(--safe-b));
      background:rgba(255,255,255,.92);
      border-top:1px solid rgba(17,24,39,.10);
      backdrop-filter: blur(10px);
    }
    .bnav{
      max-width:1180px;margin:0 auto;
      display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    }
    .btab{
      border:1px solid rgba(17,24,39,.10);
      background:#fff;
      border-radius:16px;
      padding:10px 10px;
      font-weight:950;
      cursor:pointer;
      font-size:12px;
      display:flex;flex-direction:column;align-items:center;gap:4px;
      color:#0b3c91;
    }
    .btab.active{background:var(--blue);color:#fff;border-color:transparent}
    .ico{font-size:16px;line-height:1}
    @media(min-width:980px){
      .bottombar{display:none}
      .app{padding-bottom:18px}
    }

    .toast{
      position:fixed;
      left:50%;
      bottom: calc(76px + var(--safe-b));
      transform:translateX(-50%);
      background:rgba(17,24,39,.92);
      color:#fff;
      padding:10px 12px;
      border-radius:999px;
      font-weight:900;
      font-size:12px;
      box-shadow:0 18px 40px rgba(0,0,0,.22);
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease, transform .2s ease;
      z-index:9999;
    }
    .toast.show{opacity:1; transform:translateX(-50%) translateY(-2px);}

    details{
      margin-top:10px;
      border-top:1px dashed #d1d5db;
      padding-top:10px;
    }
    details summary{
      cursor:pointer;
      font-weight:900;
      color:#0b3c91;
      font-size:12px;
      list-style:none;
    }
    details summary::-webkit-details-marker{display:none}
    pre{
      margin:10px 0 0;
      white-space:pre-wrap;
      background:#0b1220;
      color:#e5e7eb;
      padding:12px;
      border-radius:12px;
      font-size:12px;
      overflow:auto;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="brandRow">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <div class="titleWrap">
          <h1>Pedidos Toyo MX</h1>
          <div class="sub" id="subtitle">Cargando clientes…</div>
        </div>
      </div>
      <div class="pill">Portal</div>
    </div>
  </div>

  <div class="app">
    <div class="shell">
      <div class="card">
        <div class="cardHd">
          <div class="cardTitle">Búsqueda y filtros</div>
          <div class="tabs" id="tabsDesk" style="display:none">
            <button class="tab active" id="tabDeskSearch" type="button">Buscar</button>
            <button class="tab" id="tabDeskRecent" type="button">Recientes</button>
            <button class="tab" id="tabDeskVendors" type="button">Vendedores</button>
          </div>
        </div>
        <div class="cardBd">
          <label>Buscar cliente (nombre o código)</label>
          <div class="row">
            <input id="q" placeholder="Ej. GENKI o C020980" autocomplete="off" />
            <button class="btn" id="btnClear" type="button">Limpiar</button>
          </div>

          <div style="height:12px"></div>

          <label>Vendedor</label>
          <select id="vendorFilter">
            <option value="ALL">Todos</option>
          </select>

          <div class="row" style="margin-top:12px">
            <button class="btn ghost" id="btnCopyBase" type="button">Copiar link</button>
            <button class="btn" id="btnCompact" type="button">Vista compacta</button>
          </div>

          <div class="hint">
            Tip: si actualizas y no se refleja, abre con <b>?v=2</b> (o en incógnito).
          </div>

          <details id="diag">
            <summary>Diagnóstico</summary>
            <pre id="diagText">—</pre>
          </details>
        </div>
      </div>

      <div class="card">
        <div class="cardHd">
          <div class="cardTitle" id="viewTitle">Resultados</div>
          <div class="tabs">
            <button class="tab active" id="tabSearch" type="button">Buscar</button>
            <button class="tab" id="tabRecent" type="button">Recientes</button>
            <button class="tab" id="tabVendors" type="button">Vendedores</button>
          </div>
        </div>
        <div class="cardBd">
          <div class="hint" id="scope">Mostrando: todos</div>
          
          <div class="row" id="pager" style="justify-content:space-between;margin-top:10px;gap:10px;align-items:center;display:none">
            <div class="row" style="gap:8px">
              <button class="btn" id="btnPrev" type="button">Anterior</button>
              <button class="btn" id="btnNext" type="button">Siguiente</button>
            </div>
            <div class="hint" id="pageInfo">Página 1</div>
            <div class="row" style="gap:8px">
              <label style="margin:0;font-weight:900;color:#0b3c91;font-size:12px">Por página</label>
              <select id="pageSize" style="width:auto;min-width:110px;padding:10px 10px;border-radius:12px;font-size:13px">
                <option value="50">50</option>
                <option value="100" selected>100</option>
                <option value="200">200</option>
              </select>
            </div>
          </div>
<div class="list" id="list" style="margin-top:10px"></div>
          <div class="empty" id="empty" style="display:none">Sin resultados.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottombar">
    <div class="bnav">
      <button class="btab active" id="bSearch" type="button"><span class="ico">🔎</span><span>Buscar</span></button>
      <button class="btab" id="bRecent" type="button"><span class="ico">🕘</span><span>Recientes</span></button>
      <button class="btab" id="bVendors" type="button"><span class="ico">🧑‍💼</span><span>Vendedores</span></button>
    </div>
  </div>

  <div class="toast" id="toast">Listo</div>

<script>
(() => {
  const $ = (q)=>document.querySelector(q);

  const subtitle = $("#subtitle");
  const q = $("#q");
  const vendorFilter = $("#vendorFilter");
  const btnClear = $("#btnClear");
  const btnCompact = $("#btnCompact");
  const btnCopyBase = $("#btnCopyBase");

  const tabSearch = $("#tabSearch");
  const tabRecent = $("#tabRecent");
  const tabVendors = $("#tabVendors");

  const bSearch = $("#bSearch");
  const bRecent = $("#bRecent");
  const bVendors = $("#bVendors");

  const viewTitle = $("#viewTitle");
  const scope = $("#scope");
  const list = $("#list");
  const empty = $("#empty");

  
  const pager = $("#pager");
  const btnPrev = $("#btnPrev");
  const btnNext = $("#btnNext");
  const pageInfo = $("#pageInfo");
  const pageSizeSel = $("#pageSize");
const diag = $("#diag");
  const diagText = $("#diagText");
  const toastEl = $("#toast");

  const LS_REC = "toyo_index_recent_v2";
  const LS_COMPACT = "toyo_index_compact_v2";

  let ALL = [];
  let VENDORS = [];
  let MODE = "search"; // search | recent | vendors
  let ACTIVE_VENDOR = "ALL";
  let PAGE = 1;
  let PAGE_SIZE = 100;
  let LAST_TOTAL = 0;

  let compact = (localStorage.getItem(LS_COMPACT) === "1");

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(()=>toastEl.classList.remove("show"), 1500);
  }

  function esc(s){
    return (s ?? "").toString()
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }

  function norm(s){
    return (s||"").toString().trim().toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  }

  function loadJSON(key, fallback){
    try{ return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
    catch(e){ return fallback; }
  }
  function saveJSON(key, obj){
    localStorage.setItem(key, JSON.stringify(obj));
  }

  function pushRecent(path){
    let rec = loadJSON(LS_REC, []);
    rec.unshift(path);
    rec = [...new Set(rec)].slice(0, 30);
    saveJSON(LS_REC, rec);
  }

  function setDiag(obj){
    diagText.textContent = (typeof obj === "string") ? obj : JSON.stringify(obj, null, 2);
  }

  function setCompact(on){
    compact = !!on;
    localStorage.setItem(LS_COMPACT, compact ? "1" : "0");
    document.body.classList.toggle("compact", compact);
    showToast(compact ? "Vista compacta" : "Vista normal");
  }

  function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }

  function setPager(total){
    LAST_TOTAL = total || 0;
    const totalPages = Math.max(1, Math.ceil(LAST_TOTAL / PAGE_SIZE));
    PAGE = clamp(PAGE, 1, totalPages);

    if(pager){
      const shouldShow = (MODE !== "vendors") && (LAST_TOTAL > 0);
      pager.style.display = shouldShow ? "flex" : "none";
    }
    if(pageInfo){
      pageInfo.textContent = `Página ${PAGE} de ${Math.max(1, Math.ceil(LAST_TOTAL / PAGE_SIZE))}`;
    }
    if(btnPrev) btnPrev.disabled = (PAGE <= 1);
    if(btnNext) btnNext.disabled = (PAGE >= totalPages);
  }

  function resetPage(){ PAGE = 1; }

  function getPageSlice(list){
    const start = (PAGE - 1) * PAGE_SIZE;
    const end = start + PAGE_SIZE;
    return list.slice(start, end);
  }

  function setActiveTab(which){
    MODE = which;

    const active = (el, on)=>el.classList.toggle("active", on);

    active(tabSearch, MODE==="search");
    active(tabRecent, MODE==="recent");
    active(tabVendors, MODE==="vendors");

    
    // Left (desktop) tabs
    const tabDeskSearch = document.getElementById("tabDeskSearch");
    const tabDeskRecent = document.getElementById("tabDeskRecent");
    const tabDeskVendors = document.getElementById("tabDeskVendors");
    if(tabDeskSearch) active(tabDeskSearch, MODE==="search");
    if(tabDeskRecent) active(tabDeskRecent, MODE==="recent");
    if(tabDeskVendors) active(tabDeskVendors, MODE==="vendors");
active(bSearch, MODE==="search");
    active(bRecent, MODE==="recent");
    active(bVendors, MODE==="vendors");

    viewTitle.textContent =
      MODE==="search" ? "Resultados" :
      MODE==="recent" ? "Recientes" : "Vendedores";

    resetPage();
    render();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  async function loadClients(){
    const url = "clients.json?v=" + Date.now();
    try{
      setDiag({status:"fetching", url});
      const res = await fetch(url, {cache:"no-store"});
      const text = await res.text();
      if(!res.ok){
        setDiag({status:"error", http:res.status, body:text.slice(0,500)});
        throw new Error("No se pudo cargar clients.json (" + res.status + ")");
      }
      let data;
      try{ data = JSON.parse(text); }
      catch(e){
        setDiag({status:"error", msg:"clients.json no es JSON válido", sample:text.slice(0,600)});
        throw e;
      }

      const arr = Array.isArray(data) ? data : (Array.isArray(data.clients) ? data.clients : []);

      ALL = arr.map(x=>{
        const vendor_folder = (x.vendor_folder || x.seller || "").toString().trim();
        const vendor_label  = (x.vendor_label || x.vendor_name || x.seller_name || vendor_folder).toString().trim();
        const client_name   = (x.client_name || x.client || "").toString().trim();
        const client_code   = (x.client_code || x.code || "").toString().trim();

        let path = (x.path || "").toString().trim();
        if(!path){
          const file = (x.file || "").toString().trim();
          if(vendor_folder && file) path = vendor_folder + "/" + file;
        }
        return {vendor_folder, vendor_label, client_name, client_code, path};
      }).filter(x=>x.vendor_folder && x.path && x.client_name);

      const map = new Map();
      ALL.forEach(c=>{
        if(!map.has(c.vendor_folder)){
          map.set(c.vendor_folder, {folder:c.vendor_folder, label:c.vendor_label || c.vendor_folder, count:0});
        }
        map.get(c.vendor_folder).count++;
      });
      VENDORS = [...map.values()].sort((a,b)=>a.label.localeCompare(b.label, "es"));

      subtitle.textContent = `${VENDORS.length} vendedor(es) · actualizado`;

      vendorFilter.innerHTML =
        `<option value="ALL">Todos</option>` +
        VENDORS.map(v=>`<option value="${esc(v.folder)}">${esc(v.label)} (${v.count})</option>`).join("");

      vendorFilter.value = "ALL";
      ACTIVE_VENDOR = "ALL";

      setDiag({status:"ok", total_clients: ALL.length, total_vendors: VENDORS.length, sample: ALL[0]});
      diag.open = false;

      render();
    }catch(e){
      subtitle.textContent = "No se pudo cargar clients.json";
      empty.style.display = "block";
      empty.textContent = "No se pudo cargar la lista de clientes.";
      diag.open = true;
      setDiag({status:"fatal", error: e?.message || String(e)});
    }
  }

  function applyQuery(list){
    const raw = q.value || "";
    const s = norm(raw);
    if(!s) return list;

    const looksCode = /^c?\d/.test(s.replace(/\s+/g,"")) || /\d{3,}/.test(s);
    if(looksCode){
      return list.filter(c=> norm(c.client_code).includes(s) || norm(c.client_name).includes(s));
    }
    return list.filter(c=> norm(c.client_name).includes(s) || norm(c.client_code).includes(s));
  }

  function render(){
    list.innerHTML = "";
    empty.style.display = "none";

    if(!ALL.length){
      empty.style.display = "block";
      empty.textContent = "Sin datos (revisa clients.json).";
      return;
    }

    const vendorLabel = ACTIVE_VENDOR==="ALL" ? "todos" : (VENDORS.find(v=>v.folder===ACTIVE_VENDOR)?.label || ACTIVE_VENDOR);

    if(MODE === "vendors"){
      scope.textContent = "Selecciona un vendedor";
      setPager(0);
      if(pager) pager.style.display = "none";
      renderVendors();
      return;
    }

    if(MODE === "recent"){
      scope.textContent = "Últimos abiertos";
      renderRecent();
      return;
    }

    scope.textContent = `Mostrando: ${vendorLabel}`;
    renderSearch();
  }

  function renderVendors(){
    const vendors = VENDORS.slice();
    if(!vendors.length){
      empty.style.display = "block";
      empty.textContent = "No hay vendedores.";
      return;
    }
    vendors.forEach(v=>{
      const el = document.createElement("div");
      el.className = "item";
      el.innerHTML = `
        <div class="left">
          <p class="name">${esc(v.label)}</p>
          <div class="meta">${esc(v.folder)} · ${v.count} cliente(s)</div>
        </div>
        <div class="actions">
          <button class="mini open" type="button">Ver clientes</button>
        </div>
      `;
      el.querySelector("button").addEventListener("click", ()=>{
        ACTIVE_VENDOR = v.folder;
        vendorFilter.value = v.folder;
        setActiveTab("search");
        q.value = "";
        render();
        showToast("Filtrado por vendedor");
      });
      list.appendChild(el);
    });
  }

  function renderRecent(){
    const rec = loadJSON(LS_REC, []);
    const pos = new Map(rec.map((p,i)=>[p,i]));
    let base = ALL.filter(c=>pos.has(c.path)).sort((a,b)=>pos.get(a.path)-pos.get(b.path));
    if(ACTIVE_VENDOR !== "ALL"){
      base = base.filter(c=>c.vendor_folder === ACTIVE_VENDOR);
    }
    if(!base.length){
      empty.style.display = "block";
      setPager(0);
      empty.textContent = "Aún no hay recientes. Abre un cliente desde Buscar.";
      return;
    }
    setPager(base.length);
    const view = getPageSlice(base);
    renderClientList(view, base.length);
  }

  function renderSearch(){
    let base = ALL.slice();
    if(ACTIVE_VENDOR !== "ALL"){
      base = base.filter(c=>c.vendor_folder === ACTIVE_VENDOR);
    }
    base = applyQuery(base);
    base.sort((a,b)=> (a.client_name||"").localeCompare((b.client_name||""), "es"));

    if(!base.length){
      empty.style.display = "block";
      setPager(0);
      empty.textContent = "Sin resultados.";
      return;
    }
    setPager(base.length);
    const view = getPageSlice(base);
    renderClientList(view, base.length);
  }

  function renderClientList(rows, totalLen){
    rows.forEach(c=>{
      const el = document.createElement("div");
      el.className = "item";
      el.innerHTML = `
        <div class="left">
          <p class="name" title="${esc(c.client_name)}">${esc(c.client_name)}</p>
          <div class="meta">${esc(c.client_code || "—")} · ${esc(c.vendor_label || c.vendor_folder)}</div>
        </div>
        <div class="actions">
          <button class="mini open" type="button">Abrir</button>
          <button class="mini" type="button">Copiar link</button>
        </div>
      `;

      const [openBtn, copyBtn] = el.querySelectorAll("button");

      openBtn.addEventListener("click", ()=>{
        pushRecent(c.path);
        window.open(c.path, "_blank");
      });

      copyBtn.addEventListener("click", async ()=>{
        const full = new URL(c.path, window.location.href).href;
        try{
          await navigator.clipboard.writeText(full);
          showToast("Link copiado");
        }catch(e){
          const ta = document.createElement("textarea");
          ta.value = full;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
          showToast("Link copiado");
        }
      });

      list.appendChild(el);
    });

    if(totalLen && totalLen > rows.length){
      const more = document.createElement("div");
      more.className = "empty";
      more.textContent = `Total: ${totalLen}. Usa Anterior / Siguiente para navegar.`;
      list.appendChild(more);
    }
  }

  let t;
  function debounceRender(){
    clearTimeout(t);
    t = setTimeout(()=>{ if(MODE!=="vendors") render(); }, 120);
  }

  q.addEventListener("input", ()=>{
    if(MODE !== "search") setActiveTab("search");
    resetPage();
    debounceRender();
  });

  btnClear.addEventListener("click", ()=>{
    q.value = "";
    if(MODE !== "search") setActiveTab("search");
    resetPage();
    render();
    q.focus();
  });

  vendorFilter.addEventListener("change", ()=>{
    ACTIVE_VENDOR = vendorFilter.value || "ALL";
    resetPage();
    if(MODE === "vendors") setActiveTab("search");
    render();
  });

  btnCompact.addEventListener("click", ()=>setCompact(!compact));

  btnCopyBase.addEventListener("click", async ()=>{
    const base = window.location.href.split("?")[0].replace(/index\.html$/i,"");
    try{
      await navigator.clipboard.writeText(base);
      showToast("Link copiado");
    }catch(e){
      showToast("No se pudo copiar");
    }
  });

  // Pager controls
  if(pageSizeSel){
    pageSizeSel.value = String(PAGE_SIZE);
    pageSizeSel.addEventListener("change", ()=>{
      const v = parseInt(pageSizeSel.value || "100", 10);
      PAGE_SIZE = isNaN(v) ? 100 : v;
      resetPage();
      render();
    });
  }
  if(btnPrev) btnPrev.addEventListener("click", ()=>{ PAGE = Math.max(1, PAGE-1); render(); });
  if(btnNext) btnNext.addEventListener("click", ()=>{ PAGE = PAGE+1; render(); });

  tabSearch.addEventListener("click", ()=>setActiveTab("search"));
  tabRecent.addEventListener("click", ()=>setActiveTab("recent"));
  tabVendors.addEventListener("click", ()=>setActiveTab("vendors"));

  
  // Desktop tabs (left card)
  const tabDeskSearch = document.getElementById("tabDeskSearch");
  const tabDeskRecent = document.getElementById("tabDeskRecent");
  const tabDeskVendors = document.getElementById("tabDeskVendors");

  if(tabDeskSearch) tabDeskSearch.addEventListener("click", ()=>setActiveTab("search"));
  if(tabDeskRecent) tabDeskRecent.addEventListener("click", ()=>setActiveTab("recent"));
  if(tabDeskVendors) tabDeskVendors.addEventListener("click", ()=>setActiveTab("vendors"));
bSearch.addEventListener("click", ()=>setActiveTab("search"));
  bRecent.addEventListener("click", ()=>setActiveTab("recent"));
  bVendors.addEventListener("click", ()=>setActiveTab("vendors"));

  setCompact(compact);

  const tabsDesk = document.getElementById("tabsDesk");
  const showDeskTabs = ()=>{ if(tabsDesk) tabsDesk.style.display = (window.innerWidth>=980) ? "flex" : "none"; };
  window.addEventListener("resize", showDeskTabs);
  showDeskTabs();

  loadClients();
})();
</script>
</body>
</html>
