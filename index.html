<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal de Pedidos Toyo Foods</title>
  <style>
    :root{
      --bg:#f4f7fb; --card:#fff; --line:#dbe4f0; --text:#123; --muted:#5e7288; --brand:#0b4aa2;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#eef4fb,#f8fbff);color:var(--text)}
    .wrap{max-width:1200px;margin:0 auto;padding:18px}
    .hero{background:linear-gradient(135deg,#0b4aa2,#2f73d7);border-radius:22px;padding:22px;color:#fff;box-shadow:0 14px 40px rgba(11,74,162,.18)}
    .hero h1{margin:8px 0 6px;font-size:clamp(28px,5vw,46px)}
    .hero p{margin:0;color:#eaf2ff;max-width:760px}
    .toolbar{display:grid;grid-template-columns:1.7fr 1fr 1fr auto;gap:12px;margin:18px 0}
    input,select,button{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);font-size:15px}
    button{background:var(--brand);color:#fff;border:none;font-weight:700;cursor:pointer}
    button.alt{background:#fff;color:var(--brand);border:1px solid #bcd0ee}
    .meta{font-size:13px;color:var(--muted);margin:8px 0 0}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 6px 18px rgba(14,34,68,.05)}
    .tag{display:inline-block;font-size:11px;font-weight:700;color:var(--brand);background:#edf4ff;border:1px solid #d9e8ff;padding:5px 8px;border-radius:999px;margin-bottom:8px}
    .title{font-size:18px;font-weight:800;margin:4px 0 6px}
    .sub{font-size:13px;color:var(--muted);margin:2px 0}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .row a{display:inline-flex;align-items:center;justify-content:center;padding:10px 12px;border-radius:12px;text-decoration:none;font-weight:700}
    .primary{background:var(--brand);color:#fff}
    .ghost{background:#fff;color:var(--brand);border:1px solid #c7d8f3}
    .count{font-size:13px;color:var(--muted);margin-top:12px}
    .warn{margin-top:12px;background:#fff8e8;border:1px solid #f0dfae;color:#6f5700;padding:12px 14px;border-radius:14px}
    .hide{display:none}
    @media (max-width:860px){.toolbar{grid-template-columns:1fr}.wrap{padding:12px}.hero{padding:18px}}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div style="font-size:12px;font-weight:700;letter-spacing:.08em;opacity:.95">PORTAL TOYO FOODS</div>
      <h1>Portal de pedidos</h1>
      <p>Este index respeta la ruta exacta que venga en <strong>clients.json</strong>. Si tus carpetas o archivos tienen mayúsculas, deben venir exactamente igual ahí.</p>
    </section>

    <div class="toolbar">
      <input id="q" placeholder="Buscar cliente, código o vendedor" />
      <select id="seller"><option value="">Todos los vendedores</option></select>
      <select id="sort">
        <option value="name">Ordenar por cliente</option>
        <option value="code">Ordenar por código</option>
        <option value="seller">Ordenar por vendedor</option>
      </select>
      <button id="reload">Recargar</button>
    </div>

    <div id="warn" class="warn hide"></div>
    <div id="count" class="count">Cargando clientes…</div>
    <div id="grid" class="grid"></div>
  </div>

  <script>
    const state = { clients: [], filtered: [] };

    async function loadData(){
      const res = await fetch('./clients.json', {cache:'no-store'});
      if(!res.ok) throw new Error('No se pudo abrir clients.json');
      const payload = await res.json();
      return Array.isArray(payload) ? payload : (payload.clients || []);
    }

    function norm(s=''){
      return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    }

    function fillSellerOptions(clients){
      const sel = document.getElementById('seller');
      const sellers = [...new Set(clients.map(c => c.seller_name || '').filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
      sel.innerHTML = '<option value="">Todos los vendedores</option>' + sellers.map(s=>`<option value="${s.replace(/"/g,'&quot;')}">${s}</option>`).join('');
    }

    function getPath(c){
      return c.path || (c.folder && c.file_name ? `${c.folder}/${c.file_name}` : c.file || '');
    }

    function render(){
      const q = norm(document.getElementById('q').value);
      const seller = document.getElementById('seller').value;
      const sort = document.getElementById('sort').value;

      let items = state.clients.filter(c => {
        const hay = !q || [c.client_name, c.client_code, c.seller_name, getPath(c)].some(v => norm(v).includes(q));
        const okSeller = !seller || (c.seller_name || '') === seller;
        return hay && okSeller;
      });

      items.sort((a,b) => {
        if(sort === 'code') return (a.client_code||'').localeCompare(b.client_code||'','es');
        if(sort === 'seller') return (a.seller_name||'').localeCompare(b.seller_name||'','es') || (a.client_name||'').localeCompare(b.client_name||'','es');
        return (a.client_name||'').localeCompare(b.client_name||'','es');
      });

      state.filtered = items;
      document.getElementById('count').textContent = `${items.length.toLocaleString('es-MX')} clientes encontrados`;

      const grid = document.getElementById('grid');
      grid.innerHTML = items.map(c => {
        const path = getPath(c);
        return `
          <article class="card">
            <span class="tag">${c.client_code || 'SIN CÓDIGO'}</span>
            <div class="title">${c.client_name || 'Cliente sin nombre'}</div>
            <div class="sub"><strong>Vendedor:</strong> ${c.seller_name || 'Sin asignar'}</div>
            <div class="sub"><strong>Ruta exacta:</strong> ${path || 'No definida'}</div>
            <div class="row">
              <a class="primary" href="${path}" target="_blank" rel="noopener">Abrir pedido</a>
            </div>
          </article>
        `;
      }).join('');
    }

    async function init(){
      const warn = document.getElementById('warn');
      warn.classList.add('hide');
      try{
        state.clients = await loadData();
        fillSellerOptions(state.clients);
        render();
      }catch(err){
        warn.textContent = 'Este index ya no debe adivinar mayúsculas/minúsculas. Necesita un clients.json reconstruido con la ruta exacta de cada archivo.';
        warn.classList.remove('hide');
        document.getElementById('count').textContent = 'No se pudo cargar la base de clientes.';
      }
    }

    ['q','seller','sort'].forEach(id => document.addEventListener('input', (e) => { if(e.target && e.target.id === id) render(); }));
    document.getElementById('reload').addEventListener('click', init);
    init();
  </script>
</body>
</html>
