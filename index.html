<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portal de Pedidos Toyo Foods</title>
  <style>
    :root{--azul:#0b4aa2;--azul2:#184b93;--line:#dbe4f0;--bg:#f3f7fb;--txt:#10223d;--muted:#5d718a}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#eef4fb,#f8fbff);color:var(--txt)}
    .wrap{max-width:1240px;margin:0 auto;padding:18px}
    .hero{background:linear-gradient(135deg,#0b4aa2,#2f73d7);color:#fff;border-radius:24px;padding:24px;box-shadow:0 18px 50px rgba(11,74,162,.18)}
    .pill{display:inline-block;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.15);font-size:12px;font-weight:800;letter-spacing:.08em}
    h1{margin:12px 0 8px;font-size:clamp(30px,5vw,52px)} .hero p{margin:0;color:#eef5ff;max-width:760px}
    .tools{display:grid;grid-template-columns:1.5fr 1fr auto;gap:12px;margin:18px 0}
    input,select,button{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);font-size:15px}
    button{background:var(--azul);color:#fff;border:none;font-weight:800;cursor:pointer}
    .count{font-size:13px;color:var(--muted);margin:4px 0 12px}
    .warn{background:#fff6dd;border:1px solid #ecd28c;color:#745300;padding:12px 14px;border-radius:14px;margin-bottom:12px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
    .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 8px 18px rgba(15,23,42,.05)}
    .tag{display:inline-block;font-size:11px;font-weight:800;color:var(--azul);background:#edf4ff;border:1px solid #d9e8ff;padding:5px 8px;border-radius:999px;margin-bottom:8px}
    .title{font-size:19px;font-weight:900;line-height:1.15;margin:4px 0 6px}
    .sub{font-size:13px;color:var(--muted);margin:4px 0}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 14px;border-radius:12px;text-decoration:none;font-weight:800}
    .primary{background:var(--azul);color:#fff}
    .ghost{background:#fff;color:var(--azul);border:1px solid #bfd2ef}
    @media (max-width:860px){.tools{grid-template-columns:1fr}.wrap{padding:12px}.hero{padding:18px}}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <span class="pill">PORTAL TOYO FOODS</span>
      <h1>Portal de pedidos</h1>
      <p>Este index abre la ruta exacta que venga en <strong>clients.json</strong>. Si tus carpetas o archivos están en mayúsculas, se respetarán tal como existen en GitHub.</p>
    </section>

    <div class="tools">
      <input id="q" placeholder="Buscar cliente, código o vendedor">
      <select id="seller"><option value="">Todos los vendedores</option></select>
      <button id="reload">Recargar</button>
    </div>

    <div id="warn" class="warn" style="display:none"></div>
    <div id="count" class="count">Cargando clientes…</div>
    <div id="grid" class="grid"></div>
  </div>

<script>
const state={clients:[],filtered:[]};
function norm(s=''){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
async function loadData(){
  const r=await fetch('./clients.json?ts='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('No se pudo abrir clients.json');
  const payload=await r.json();
  return Array.isArray(payload)?payload:(payload.clients||[]);
}
function getPath(c){return c.path||c.file||''}
function fillSellers(list){
  const sel=document.getElementById('seller');
  const sellers=[...new Set(list.map(x=>x.vendor_label||x.seller_name||'').filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  sel.innerHTML='<option value="">Todos los vendedores</option>'+sellers.map(s=>`<option value="${s.replace(/"/g,'&quot;')}">${s}</option>`).join('');
}
function render(){
  const q=norm(document.getElementById('q').value);
  const seller=document.getElementById('seller').value;
  let rows=state.clients.filter(c=>{
    const vlabel=c.vendor_label||c.seller_name||'';
    const okQ=!q || [c.client_name,c.client_code,vlabel,getPath(c)].some(v=>norm(v).includes(q));
    const okS=!seller || vlabel===seller;
    return okQ && okS;
  });
  state.filtered=rows;
  document.getElementById('count').textContent=`${rows.length.toLocaleString('es-MX')} clientes encontrados`;
  document.getElementById('grid').innerHTML=rows.map(c=>{
    const path=getPath(c);
    const vlabel=c.vendor_label||c.seller_name||'Sin vendedor';
    return `<article class="card">
      <div class="tag">${c.client_code||'SIN CÓDIGO'}</div>
      <div class="title">${c.client_name||'Cliente sin nombre'}</div>
      <div class="sub"><strong>Vendedor:</strong> ${vlabel}</div>
      <div class="sub"><strong>Ruta exacta:</strong> ${path}</div>
      <div class="row">
        <a class="btn primary" href="${path}" target="_blank" rel="noopener">Abrir pedido</a>
      </div>
    </article>`;
  }).join('');
}
async function init(){
  const warn=document.getElementById('warn');
  warn.style.display='none';
  try{
    state.clients=await loadData();
    fillSellers(state.clients);
    render();
  }catch(e){
    warn.textContent='No se pudo cargar la base. Debes regenerar clients.json con el script del paquete para respetar mayúsculas y minúsculas reales.';
    warn.style.display='block';
    document.getElementById('count').textContent='Error al cargar clientes.';
  }
}
document.getElementById('q').addEventListener('input',render);
document.getElementById('seller').addEventListener('input',render);
document.getElementById('reload').addEventListener('click',init);
init();
</script>
</body>
</html>
