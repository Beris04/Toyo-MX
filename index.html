<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Portal de Pedidos Toyo Foods</title>
  <meta name="theme-color" content="#0b4aa2"/>
  <style>
    :root{--brand:#0b4aa2;--brand2:#2f73d7;--bg:#f4f7fb;--card:#fff;--line:#dbe4f0;--text:#12324d;--muted:#60738a}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#eef4fb,#f8fbff);color:var(--text)}
    .wrap{max-width:1220px;margin:0 auto;padding:18px}
    .hero{background:linear-gradient(135deg,var(--brand),var(--brand2));border-radius:24px;padding:24px;color:#fff;box-shadow:0 18px 50px rgba(11,74,162,.18)}
    .eyebrow{display:inline-flex;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.14);font-size:12px;font-weight:800;letter-spacing:.08em}
    h1{margin:12px 0 8px;font-size:clamp(28px,5vw,48px)} .hero p{margin:0;max-width:760px;color:#ebf4ff}
    .tools{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:12px;margin:18px 0}
    input,select,button{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);font-size:15px}
    button{background:var(--brand);color:#fff;border:none;font-weight:800;cursor:pointer}
    .count{font-size:13px;color:var(--muted);margin-bottom:12px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 8px 18px rgba(15,23,42,.05)}
    .tag{display:inline-block;font-size:11px;font-weight:800;color:var(--brand);background:#edf4ff;border:1px solid #d9e8ff;padding:5px 8px;border-radius:999px;margin-bottom:8px}
    .title{font-size:18px;font-weight:900;line-height:1.15;margin:4px 0 8px}
    .sub{font-size:13px;color:var(--muted);margin:4px 0}
    .btn{display:inline-flex;align-items:center;justify-content:center;margin-top:12px;padding:11px 14px;border-radius:12px;background:var(--brand);color:#fff;text-decoration:none;font-weight:800}
    @media (max-width:860px){.tools{grid-template-columns:1fr}.wrap{padding:12px}.hero{padding:18px}}
  </style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="eyebrow">PORTAL TOYO FOODS</div>
    <h1>Portal de pedidos</h1>
    <p>Generado desde el historial octubre a abril. Todas las carpetas y archivos HTML están en minúsculas para evitar problemas de apertura en GitHub Pages.</p>
  </section>

  <div class="tools">
    <input id="q" placeholder="Buscar cliente, código o vendedor"/>
    <select id="vendor"><option value="">Todos los vendedores</option></select>
    <select id="sort">
      <option value="client">Ordenar por cliente</option>
      <option value="code">Ordenar por código</option>
      <option value="vendor">Ordenar por vendedor</option>
    </select>
    <button id="reload">Recargar</button>
  </div>

  <div id="count" class="count">Cargando clientes…</div>
  <div id="grid" class="grid"></div>
</div>
<script>
const state={rows:[]};
const norm=s=>(s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
async function loadRows(){
  const r=await fetch('./clients.json?v=20260506history1',{cache:'no-store'});
  if(!r.ok) throw new Error('No se pudo abrir clients.json');
  return await r.json();
}
function fillVendor(rows){
  const sel=document.getElementById('vendor');
  const vendors=[...new Set(rows.map(r=>r.vendor_label).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  sel.innerHTML='<option value="">Todos los vendedores</option>'+vendors.map(v=>`<option value="${v.replace(/"/g,'&quot;')}">${v}</option>`).join('');
}
function render(){
  const q=norm(document.getElementById('q').value);
  const vendor=document.getElementById('vendor').value;
  const sort=document.getElementById('sort').value;
  let rows=state.rows.filter(r=>{
    const okQ=!q || [r.client_name,r.client_code,r.vendor_label,r.path].some(v=>norm(v).includes(q));
    const okV=!vendor || r.vendor_label===vendor;
    return okQ && okV;
  });
  rows.sort((a,b)=>{
    if(sort==='code') return (a.client_code||'').localeCompare(b.client_code||'','es');
    if(sort==='vendor') return (a.vendor_label||'').localeCompare(b.vendor_label||'','es') || (a.client_name||'').localeCompare(b.client_name||'','es');
    return (a.client_name||'').localeCompare(b.client_name||'','es');
  });
  document.getElementById('count').textContent = `${rows.length.toLocaleString('es-MX')} clientes encontrados`;
  document.getElementById('grid').innerHTML = rows.map(r=>`
    <article class="card">
      <div class="tag">${r.client_code || 'SIN CÓDIGO'}</div>
      <div class="title">${r.client_name}</div>
      <div class="sub"><strong>Vendedor:</strong> ${r.vendor_label}</div>
      <div class="sub"><strong>Ruta:</strong> ${r.path}</div>
      <a class="btn" href="${r.path}" target="_blank" rel="noopener">Abrir pedido</a>
    </article>
  `).join('');
}
async function init(){
  state.rows=await loadRows();
  fillVendor(state.rows);
  render();
}
document.getElementById('q').addEventListener('input',render);
document.getElementById('vendor').addEventListener('input',render);
document.getElementById('sort').addEventListener('input',render);
document.getElementById('reload').addEventListener('click',init);
init();
</script>
</body>
</html>
